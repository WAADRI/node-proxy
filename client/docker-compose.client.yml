# =============================================================================
# Node-Proxy Client - Docker Compose
# =============================================================================
# 用法（在内网节点机器上执行）：
#   docker compose -f docker-compose.client.yml up -d
#
# 常用环境变量覆盖：
#   SERVER_URL=ws://你的服务器IP:3000/ws   （必改）
#   AUTH_TOKEN=my-secret-token            （必改，需与服务端一致）
#   TAGS=region:cn,isp:unicom             （节点标签，逗号分隔）
#   REGION=cn                             （区域标识）
#
# 示例：
#   SERVER_URL=ws://1.2.3.4:3000/ws AUTH_TOKEN=secret TAGS=region:cn \
#     docker compose -f docker-compose.client.yml up -d
# =============================================================================

services:
  proxy-client:
    build:
      context: .
      dockerfile: Dockerfile
    image: node-proxy-client:latest
    container_name: node-proxy-client
    restart: unless-stopped
    environment:
      # 必填：服务端地址与认证令牌
      - SERVER_URL=${SERVER_URL:-ws://127.0.0.1:3000/ws}
      - AUTH_TOKEN=${AUTH_TOKEN:-node-proxy-default-token}
      # 可选：节点信息
      - REGION=${REGION:-unknown}
      - TAGS=${TAGS:-}
      # 可选：连接参数
      - RECONNECT_DELAY=${RECONNECT_DELAY:-3000}
      - MAX_RECONNECT_DELAY=${MAX_RECONNECT_DELAY:-30000}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-15000}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30000}
      - TUNNEL_TIMEOUT=${TUNNEL_TIMEOUT:-30000}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-100}
      - TLS_REJECT_UNAUTHORIZED=${TLS_REJECT_UNAUTHORIZED:-false}
    # 可选：挂载客户端配置文件（config.yaml，模板见同目录 config.yaml.example）
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
