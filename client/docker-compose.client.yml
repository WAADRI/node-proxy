# =============================================================================
# Node-Proxy Client - Docker Compose
# =============================================================================
# 用法（在内网节点机器上执行）：
#   docker compose -f docker-compose.client.yml up -d
#
# 配置方式：下面 environment 里列出的变量都可以在启动命令前覆盖，
# 未设置的会退回 config.yaml（模板见 config.yaml.example）或内置默认值。
#
# 常用环境变量覆盖：
#   SERVER_URL=ws://你的服务器IP:3000/ws   （必改）
#   AUTH_TOKEN=my-secret-token             （必改，需与服务端一致）
#   CLIENT_ID=np-node-beijing-01           （可选：固定节点 ID，便于面板识别；
#                                           不设置则由客户端自动生成 UUID 并持久化）
#   REGION=河南平顶山                       （可选：节点区域）
#   TAGS=联通                              （可选：节点标签，逗号分隔）
#
# 注意：environment 是显式白名单，只有这里列出的变量才会传进容器；
# 区域/标签在面板设置过则以面板为准，这里的值仅作为节点侧默认值。
#
# 示例：
#   SERVER_URL=ws://1.2.3.4:3000/ws AUTH_TOKEN=secret CLIENT_ID=np-node-01 \
#     REGION=河南平顶山 TAGS=联通 \
#     docker compose -f docker-compose.client.yml up -d
# =============================================================================

services:
  proxy-client:
    build:
      context: .
      dockerfile: Dockerfile
    image: node-proxy-client:latest
    container_name: node-proxy-client
    restart: unless-stopped
    environment:
      # 必填：服务端地址与认证令牌；可选：固定节点 UUID
      - SERVER_URL=${SERVER_URL:-ws://127.0.0.1:3000/ws}
      - AUTH_TOKEN=${AUTH_TOKEN:-node-proxy-default-token}
      # 可选：固定节点 UUID（不设则客户端自动生成并持久化到 ~/.node-proxy-client-id）
      - CLIENT_ID=${CLIENT_ID:-}
      # 可选：节点区域 / 标签（面板未设置时显示这里的值）
      - REGION=${REGION:-}
      - NODE_REGION=${NODE_REGION:-}
      - TAGS=${TAGS:-}
      # 节点只允许配置以上几项（issue #53 第四条）：心跳、超时、并发、重连退避等
      # 行为参数已固定为内置常量，这里不再透传，设了也不会生效。
    # 可选：挂载客户端配置文件（config.yaml，模板见同目录 config.yaml.example）
    # 同样只读取上面几项，其余条目会被忽略并在启动日志中提示。
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
