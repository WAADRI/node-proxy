# =============================================================================
# Node-Proxy - Docker Compose
# =============================================================================

services:
  proxy-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-proxy-server
    restart: unless-stopped
    ports:
      - "3000:3000"   # Web panel
      - "8080:8080"   # HTTP proxy
      - "1080:1080"   # SOCKS5 proxy
    volumes:
      - ./server/config.yaml:/app/config.yaml:ro
      - ./server/data:/app/data
      - ./server/certs:/app/certs
      - ./server/logs:/app/logs
    environment:
      - NP_AUTH_TOKEN=${NP_AUTH_TOKEN:-node-proxy-default-token}
      - NP_AUTH_WEB_USERNAME=${NP_AUTH_WEB_USERNAME:-admin}
      - NP_AUTH_WEB_PASSWORD=${NP_AUTH_WEB_PASSWORD:-admin123}
      - NP_LOGGING_LEVEL=${NP_LOGGING_LEVEL:-info}
      - NP_ROUTING_STRATEGY=${NP_ROUTING_STRATEGY:-random}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: node-proxy-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - proxy-server
    profiles:
      - monitoring

  # Optional: Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: node-proxy-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  prometheus-data:
  grafana-data: