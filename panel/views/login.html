<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node-Proxy 登录</title>
  <meta name="theme-color" content="#070a12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%234c8dff'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial, sans-serif' font-size='25' font-weight='bold' text-anchor='middle' fill='%23fff'%3ENP%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070a12;
      --panel: rgba(15, 22, 38, 0.78);
      --border: rgba(148, 163, 184, 0.16);
      --text: #f1f5fc;
      --text-2: #c3cede;
      --muted: #8391aa;
      --primary: #4c8dff;
      --violet: #a78bfa;
      --danger: #fb7185;
    }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC',
        'Microsoft YaHei', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(900px 520px at 12% 0%, rgba(76, 141, 255, 0.2), transparent 60%),
        radial-gradient(760px 460px at 88% 8%, rgba(139, 92, 246, 0.16), transparent 58%),
        radial-gradient(640px 480px at 50% 108%, rgba(34, 211, 238, 0.08), transparent 62%),
        linear-gradient(rgba(148, 163, 184, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.045) 1px, transparent 1px);
      background-size: auto, auto, auto, 52px 52px, 52px 52px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      position: relative;
    }
    .login-container::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(76, 141, 255, 0.5), rgba(139, 92, 246, 0.14) 42%, transparent 70%);
      filter: blur(14px);
      opacity: 0.55;
      z-index: 0;
      pointer-events: none;
    }
    .login-box {
      position: relative;
      z-index: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 34px 30px 26px;
      box-shadow: 0 30px 80px rgba(2, 6, 23, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      animation: rise 0.45s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: linear-gradient(135deg, #4c8dff, #7c6cff 52%, #8b5cf6);
      box-shadow: 0 10px 26px rgba(76, 141, 255, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex: none;
    }
    .brand-mark::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 10px;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .brand-sub {
      margin-top: 3px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .login-heading {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 18px;
      color: var(--text-2);
    }
    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 7px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .field {
      position: relative;
    }
    .field-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }
    .form-group input {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 40px;
      background: rgba(7, 10, 18, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 11px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    .form-group input:focus {
      border-color: var(--primary);
      background: rgba(7, 10, 18, 0.78);
      box-shadow: 0 0 0 3px rgba(76, 141, 255, 0.15);
    }
    .form-group input::placeholder { color: #5e6b84; }
    .btn {
      width: 100%;
      height: 44px;
      margin-top: 4px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255, 255, 255, 0.14);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      background: linear-gradient(135deg, #4c8dff, #6d6cff 55%, #8b5cf6);
      color: #fff;
      box-shadow: 0 12px 28px rgba(76, 141, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: 0 16px 34px rgba(76, 141, 255, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      color: var(--danger);
      font-size: 12.5px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }
    .hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
    }
    .hint .dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .hint .dot::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.14);
    }
    .loading-spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.32);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: -2px;
      margin-right: 7px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-box { padding: 28px 22px 22px; }
      .brand-name { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="brand">
        <div class="brand-mark">NP</div>
        <div>
          <div class="brand-name">Node-Proxy</div>
          <div class="brand-sub">Distributed Proxy Gateway</div>
        </div>
      </div>
      <div class="login-heading">登录管理面板</div>
      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label for="username">用户名</label>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username" autofocus>
          </div>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="11" width="16" height="10" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
          </div>
        </div>
        <button type="submit" class="btn" id="loginBtn">登 录</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
      <div class="hint">
        <span class="dot">服务在线</span>
        <span>Node-Proxy v3.0</span>
      </div>
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
