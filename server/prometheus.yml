# Prometheus configuration for Node-Proxy
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node-proxy'
    static_configs:
      - targets: ['proxy-server:3000']
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'node-proxy-server'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']