name: 质量检查
# Issue #42 (Phase 0)：TypeScript 编译检查 / ESLint（禁 any）/ OpenAPI 校验骨架 / 单元测试。
# 规则只作用于新增 .ts 文件与 OpenAPI 文档；存量 JS 在迁移完成前不被硬性拦截。
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装根工具依赖
        run: npm ci
      - name: 安装 server 运行依赖（tsc 解析其类型）
        run: npm install --prefix server --no-audit --no-fund
      - name: TypeScript 编译检查（server + client）
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装根工具依赖
        run: npm ci
      - name: ESLint（新增 .ts 必须无 any）
        run: npm run lint

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装根工具依赖
        run: npm ci
      - name: OpenAPI 规范校验
        run: npm run openapi:validate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装根工具依赖
        run: npm ci
      - name: 安装 server 运行依赖（测试需要 ws）
        run: npm install --prefix server --no-audit --no-fund
      - name: 安装 client 运行依赖（配置 schema 需要 js-yaml）
        run: npm install --prefix client --no-audit --no-fund
      - name: 服务端单元测试
        run: npm test --prefix server
      - name: 客户端配置 schema 测试
        run: node --test "test/**/*.test.ts"
        working-directory: client
      - name: 客户端存活看门狗测试
        run: bash client/test/watchdog.test.sh
