name: 临时验证（测试可跑性）
# TEMPORARY: verifies on the real runner that (a) the server suite runs under
# Node 24 via `npm test`, (b) the client liveness supervisor suite passes under
# Linux sh/bash including its container end-to-end case. Removed before merge.
on:
  push:
    branches: [fix/watchdog-kill-escalation]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装根工具依赖
        run: npm ci
      - name: 安装 server 运行依赖（测试需要 ws）
        run: npm install --prefix server --no-audit --no-fund
      - name: 服务端单元测试
        run: node --test "test/**/*.test.ts"
        working-directory: server
      - name: 客户端存活看门狗测试
        run: bash client/test/watchdog.test.sh
