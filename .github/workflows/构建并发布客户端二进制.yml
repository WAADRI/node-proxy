# =============================================================================
# 工作流：构建并发布客户端二进制（单文件、免安装 Node.js）
#   - 打包器：Bun（bun build --compile，内嵌运行时与依赖）
#   - 触发：PR 仅构建校验；推送 v* 标签（如 v2.0.0）时构建并发布到 GitHub Release
#   - 平台：Windows x64 / Linux x64 / Linux arm64（Bun 支持交叉编译）
#   - 产物：node-proxy-client-<版本>-<平台>[.exe]
# =============================================================================
name: 构建并发布客户端二进制

on:
  push:
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win-x64
            target: bun-windows-x64
            ext: .exe
          - id: linux-x64
            target: bun-linux-x64
            ext: ''
          - id: linux-arm64
            target: bun-linux-arm64
            ext: ''
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2

      - name: 安装依赖（使用已提交的 bun.lock）
        working-directory: client
        run: bun install --frozen-lockfile --no-progress

      - name: 计算版本号
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译单文件二进制
        working-directory: client
        run: |
          mkdir -p dist
          bun build --compile \
            --target=${{ matrix.target }} \
            --outfile dist/node-proxy-client-${{ steps.ver.outputs.value }}-${{ matrix.id }}${{ matrix.ext }} \
            client.js
          ls -lh dist/

      - name: 上传构建产物（供发布作业汇总）
        uses: actions/upload-artifact@v4
        with:
          name: client-bin-${{ matrix.id }}
          path: client/dist/node-proxy-client-*${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 汇总各平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: client-bin-*
          merge-multiple: true
          path: bins

      - name: 发布（附带二进制文件）
        uses: softprops/action-gh-release@v2
        with:
          files: bins/*
          generate_release_notes: true
          fail_on_unmatched_files: true
