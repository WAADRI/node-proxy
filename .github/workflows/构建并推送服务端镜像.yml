# =============================================================================
# 工作流：构建并推送服务端镜像
#   - 镜像：sgccr.ccs.tencentyun.com/misaka-public/waadri-proxy:master（固定 tag）
#   - 触发：push（任意分支）与 pull_request 均构建
#   - 上传：仅 main——`master` 是生产标签，服务端直接拉取它，因此只有已合入
#     的代码可以写入；其余分支与 PR 只构建校验，不上传
#   - 平台：linux/amd64、linux/arm64（多架构 manifest）
#   - 私密：TENCENT_CCR_USERNAME / TENCENT_CCR_PASSWORD（仓库级私密）
#   - 说明：非 main 分支不上传，因此构建校验不需要任何凭据
#   - 构建阶段（server/Dockerfile）会先完成管理后台前端（server/web）构建
# =============================================================================
name: 构建并推送服务端镜像

on:
  push:
  pull_request:

env:
  REGISTRY: sgccr.ccs.tencentyun.com
  IMAGE_REPOSITORY: misaka-public/waadri-proxy
  IMAGE_TAG: master
  PLATFORMS: linux/amd64,linux/arm64

# 同一分支的多次触发只保留最后一次（多平台构建耗时，取消过期任务）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: 构建并推送服务端镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 QEMU（用于 arm64 交叉构建）
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云容器镜像服务（CCR）
        # 只有 main 会推送生产标签，其余构建仅做校验，不需要凭据
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_CCR_USERNAME }}
          password: ${{ secrets.TENCENT_CCR_PASSWORD }}

      - name: 构建并推送镜像（amd64 + arm64）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          # 仅 main 推送：标签是生产标签，任意分支/PR 都能覆盖它就意味着
          # 未评审的代码可能被服务端直接拉到。其余分支与 PR 只构建校验。
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          # 用 GitHub Actions 缓存加速重复构建（fork PR 上缓存写入会被自动跳过，不影响结果）
          cache-from: type=gha
          cache-to: type=gha,mode=max
