name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Test before release
        run: go test -count=1 ./...

      - name: Build all platforms
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/WAADRI/node-proxy-go/internal/server.Version=${VERSION} -X github.com/WAADRI/node-proxy-go/internal/client.Version=${VERSION}"
          mkdir -p dist
          for platform in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${platform%/*}"; GOARCH="${platform#*/}"
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags "$LDFLAGS" -o "dist/node-proxy-server-${GOOS}-${GOARCH}${ext}" ./cmd/node-proxy-server
            GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags "$LDFLAGS" -o "dist/node-proxy-client-${GOOS}-${GOARCH}${ext}" ./cmd/node-proxy-client
          done
          (cd dist && sha256sum -- * > checksums.sha256)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
