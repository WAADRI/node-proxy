name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: gofmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt needed on:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -count=1 ./...

      - name: cross-compile check
        run: |
          for platform in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${platform%/*}" GOARCH="${platform#*/}" go build -o /dev/null ./cmd/node-proxy-server
            GOOS="${platform%/*}" GOARCH="${platform#*/}" go build -o /dev/null ./cmd/node-proxy-client
          done
