# 客户端节点部署：在每台要作为代理出口的机器上运行。
#
# 两种配置方式（二选一或混用）：
#
# 方式一：环境变量（下方 environment 中的 ${...} 写法）
#
# 方式二：config.yaml 文件挂载
#   1. 复制 config.client.yaml.example 为 config.yaml 按需填写
#   2. 取消 volumes 中 config.yaml 那行的注释
#   3. 不需要再设置 environment 中的 SERVER_URL / AUTH_TOKEN 变量
#
# 节点 ID 持久化在 client-id 卷中，容器重建不会变。

services:
  client:
    image: ghcr.io/waadri/node-proxy-client:latest
    container_name: node-proxy-client
    environment:
      SERVER_URL: ${SERVER_URL:-}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      CLIENT_ID: ${CLIENT_ID:-}
      REGION: ${REGION:-}
      TAGS: ${TAGS:-}
      COMPRESS_ENABLED: ${COMPRESS_ENABLED:-true}
    volumes:
      # 方式二：取消注释挂载 config.yaml
      # - ./config.yaml:/app/config.yaml:ro
      - client-id:/home/nodeproxy/.node-proxy-client-id
    restart: unless-stopped

volumes:
  client-id:
